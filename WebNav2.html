<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Navbar #7</title>
    <style>
        * {
            padding:0;
            margin:0;
            box-sizing:border-box;
        }
        body {
            background-image:url(imagee/karsten-wurth-lsJ9jHKIqHg-unsplash.jpg);
            background-size:cover;
        }
        /* img {
         max-width:100%;
         height:92vh;
         background-size:cover;
        } */
        nav {
            margin:10px 0px;
            width:100%;
            height:70px;
        }
        nav .L {
        color:white;
        font-size:2rem;
        font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        float:left;
        line-height:70px;
        margin-left:80px;
        font-weight:bold;
        text-shadow:1px 1px 9px #2222;
        }
        nav ul {
            float:right;
            list-style-type:none;
        }
        nav ul li {
            display:inline-block;
            line-height:70px;
            /* padding:0px 15px; */
        }
        nav ul li a{
            color:white;
            text-transform:uppercase ;
            font-weight:600;
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size:15px;
            padding:10px 20px;    
            border-radius:40px;
            text-decoration:none;
            text-shadow:0px 1px 2px black;
            position:relative;
        }

        nav ul li a:hover {
        background-color:#2424247e;
        backdrop-filter:blur(2rem);
        transition:1s ease 0s ;
        }
        nav ul button{
        transition:0.5s ease 0s;
            color:white;
            font-size:16px;
            font-weight:600;
            letter-spacing:1px;
            background-color:#e18516;
            padding:10px 20px;
            margin:0px 70px;
            border:2px solid rgba(44, 44, 44, 0.7);
            border-radius:50px;
        }
        nav ul button:hover {
            background-color: #b36d17;
        }
        .container section {
         font-size:5rem;
         font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
         color:white;
         text-shadow:1px 1px 3px rgba(0, 0, 0, 0.87);
         position:relative;
        }
       .msg {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50% ,-50%)
        }
        </style>
</head>
<body>
<div class="container">

    <nav>
 <div contenteditable="" title="HEHE BOI😁😁😁😁" class="L">TECH LEARN
 </div>
 <ul>
    <li> <a href="">Home</a> </li>
    <li> <a href="">Topics</a> </li>
    <li> <a href="">About Us</a> </li>
    <li> <a href="">Contact Us</a> </li>
    <button>Login</button>
 </ul>
    </nav> <div class="msg">
    <section>Welcome Dear!</section>
</div>
</div><!--Ending of the Container-->
</body>
</html>
