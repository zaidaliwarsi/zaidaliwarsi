<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Element Selector</title>
    <style>
    * {
        box-sizing:border-box;
        margin:0;
        padding:0;
    }
    header::before {
        content:"::Before🎁";
        width:330px;
        display:flex;
        background-color:red;
        justify-content:center;
        align-items:center;
        border-left:5px solid black;
        border-radius:10px;
        position:relative;
    }
    header::after {
        position:relative;
        top:5px;
        content:"::After💕";
        width:330px;
        display:flex;
        background-color: palevioletred;
        align-items:center;
        justify-content:center;
        border-right:5px solid black;
        border-radius:10px;
    }
    
   .Parent  {
    
       background-image:linear-gradient(to left bottom , pink , lightgreen);
        height:100vh;
        font-family:cambria;
        font-size:2rem;
        display:flex;
        justify-content:center;
        align-items:center;
    }
    
</style>
</head>
<body>
<div class="Parent">

<header title="Get This by adding a Title Attribute in the Child">&lt;Tech learn by Zaid Ali&gt;</header>

</div><!--Closing of the Parent-->
</body>
</html>
