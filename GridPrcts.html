<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practise for Grid</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      Nav {
        height: 999px;
        width: 200px;
        float: left;
        background-color: lightpink;
        border: 3px solid #000;
        margin-right: 10px;
      }
      header {
        min-height: 200px;
        text-align: center;
        font-family: cursive;
        font-size: x-large;
        background-color: lightpink;
        min-height: 100px;
        border: 3px dotted #000;
        margin-bottom: 10px;
        line-height: 200px;
      }
      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-gap: 10px;
        grid-auto-rows: 328px;
      }
      .itembox {
        background-color: lightpink;
        min-height: 100px;
        border: 4px solid rgb(56, 16, 231);
      }
      .container #one {
        grid-column-start: 1;
        grid-column-end: 2;
        grid-row-start: 1;
        grid-row-end: 3;
      }
      footer {
        background-color: lightpink;
        min-height: 90px;
        margin-top: 10px;
        border: 3px dashed rgb(255, 38, 190);
      }
    </style>
    <!--Closing of the Style Tag-->
  </head>
  <body>
    <nav>Nav Bar</nav>
    <div class="main">
      <header>Web Layout #1</header>

      <!--Closing of the Main-->
      <div class="container">
        <div class="itembox" id="one">Box 1</div>
        <div class="itembox" id="teo">Box 2</div>
        <div class="itembox">Box 3</div>
        <div class="itembox">Box 4</div>
        <div class="itembox">Box 5</div>
      </div>
      <!--Closing of the Container DIV-->
      <footer>Footer</footer>
      <!--Closing of the Footer-->
    </div>
    <!--Ending of the Main Attribute-->
  </body>
</html>
